aid: excelergy
name: Excelergy
description: >-
  Excelergy is a global provider of high-performance retail energy billing and
  revenue management software, now part of Harris Computer. Its flagship product,
  RevenueManager, is a cloud-based, meter-to-cash billing platform used by
  competitive energy retailers across more than 200 jurisdictions in North America,
  Europe, and Asia Pacific. RevenueManager handles residential, commercial,
  industrial, and wholesale billing across multiple commodities (electricity,
  natural gas, water, heat, and sewage), supporting complex tariff and pricing
  models, customer lifecycle management, smart-meter and time-of-use pricing, and
  built-in Salesforce CRM integration. The platform exposes APIs for connectivity
  with third-party systems and access to data held in the RevenueManager database.
  This API Evangelist profile was surfaced as a Battery Ventures portfolio company;
  Excelergy publishes a corporate marketing site and a customer support portal but
  no public developer portal, API documentation, or machine-readable specifications.
